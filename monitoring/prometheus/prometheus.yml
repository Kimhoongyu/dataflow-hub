# Local scrape config (docker compose --profile monitoring). In Kubernetes the same targets
# are discovered from pod annotations / ServiceMonitors instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    # DNS A records resolve to every replica, so `--scale worker=N` is picked up automatically.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s
