# NCP ALB Ingress Controller (installed by default on KVM NKS clusters). Each Ingress creates
# one Application Load Balancer, so the app keeps a single Ingress for both paths.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataflow
  annotations:
    alb.ingress.kubernetes.io/network-type: public
    alb.ingress.kubernetes.io/load-balancer-size: small
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Certificate Manager certificate number for the domain; set before the first apply.
    alb.ingress.kubernetes.io/ssl-certificate-no: "REPLACE_WITH_CERTIFICATE_NO"
    # Both target groups answer 200 here: the API directly, the SPA via its index.html fallback.
    alb.ingress.kubernetes.io/healthcheck-path: /api/health/live
spec:
  ingressClassName: alb
