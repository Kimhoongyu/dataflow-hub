name: dataflow-hub

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local S3-compatible object storage; replaced by NCP Object Storage when deployed.
  s3:
    image: chrislusf/seaweedfs:3.85
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
              "-master.volumeSizeLimitMB=64", "-volume.max=8"]
    volumes:
      - s3_data:/data
      - ./deploy/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./backend
      target: runtime
    environment: &backend-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:${API_PORT:-8000},http://127.0.0.1:${API_PORT:-8000}
      COOKIE_SECURE: "false"
      # Local-only credentials matching deploy/local/seaweedfs-s3.json. NCP uses its own API keys.
      S3_ENDPOINT_URL: http://s3:8333
      S3_REGION: kr-standard
      S3_ACCESS_KEY: dataflow-local
      S3_SECRET_KEY: dataflow-local-secret
      S3_BUCKET: uploads
      MAX_UPLOAD_BYTES: "10485760"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Same image as the API; scale out with `docker compose up -d --scale worker=3`.
  worker:
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "worker.main"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Lets the current job finish after SIGTERM before the container is killed.
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: dataflow_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: local_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d dataflow_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      POSTGRES_HOST: test-db
      POSTGRES_DB: dataflow_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: local_test_only
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      test-db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  s3_data:
