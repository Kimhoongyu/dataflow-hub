name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dataflow_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d dataflow_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dataflow_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: local_test_only
      ALLOWED_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      # Includes `alembic upgrade head` + `alembic check` (migrations match the models).
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  config:
    name: Compose & monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose --profile monitoring --profile test config -q
      - name: Check Prometheus rules and config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/p:ro" prom/prometheus:v3.3.0 check rules /p/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.3.0 check config /etc/prometheus/prometheus.yml
      - name: Render and validate Kubernetes manifests
        run: |
          # The ncp overlay reads Terraform-generated env files; validate it with the examples.
          for f in config secret; do cp deploy/k8s/overlays/ncp/generated/$f.env.example deploy/k8s/overlays/ncp/generated/$f.env; done
          for overlay in local ncp; do
            kubectl kustomize deploy/k8s/overlays/$overlay               | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.32.0 -
          done

  images:
    name: Build images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only for now; pushing to NCP Container Registry is added with the Terraform deployment.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
          tags: dataflow-hub-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: false
          tags: dataflow-hub-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
